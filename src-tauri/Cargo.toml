[package]
name = "rate-it"
description = "rate_it: rate the songs you listen to on Spotify"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "rate_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64.workspace = true
rate-it-core.workspace = true
rate-it-spotify.workspace = true
rate-it-storage.workspace = true
serde.workspace = true
# tauri::generate_context! expands to code that names serde_json.
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.13"
reqwest.workspace = true
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4.2.0"
tauri-plugin-oauth = "2.1.0"

[package.metadata.cargo-machete]
# Used by the code that tauri::generate_context! makes.
ignored = ["serde_json"]

[lints]
workspace = true
