# Cargo workspace for the rate_it Tauri 2 backend. See docs/SPEC.md.
# Add "src-tauri" to members when the Tauri app crate exists.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Groups (priority -1, so the single lints below win)
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

# Restriction lints against AI-generated shortcuts
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "warn"
as_conversions = "warn"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"

# Nursery lint, picked one by one
cognitive_complexity = "warn"

# Pedantic lints that only add noise here
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
