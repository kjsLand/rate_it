# Cargo workspace for the rate_it Tauri 2 backend. See docs/SPEC.md.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.99"

[workspace.dependencies]
rate-it-core = { path = "crates/core" }
rate-it-spotify = { path = "crates/spotify" }
rate-it-storage = { path = "crates/storage" }

async-trait = "0.1.92"
base64 = "0.23.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-util = "0.7.20"
url = "2.5.8"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Groups (priority -1, so the single lints below win)
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

# Restriction lints against AI-generated shortcuts
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "warn"
as_conversions = "warn"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"

# Nursery lint, picked one by one
cognitive_complexity = "warn"

# Pedantic lints that only add noise here
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
